services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stocksim
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stocksim"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stock:stock@db:5432/stocksim
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./backend:/app", "./ml/models:/models"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stock:stock@db:5432/stocksim
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./backend:/app", "./ml/models:/models"]
    command: python -m app.pipelines.scheduler

volumes:
  pgdata:
