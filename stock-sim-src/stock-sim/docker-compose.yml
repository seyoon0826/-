# 전체 기동: docker compose up -d --build   (SPEC 14: db, redis, api, scheduler, marketdata, frontend)
# 개발 중 DB/Redis 만: make up
#
# - migrate 가 먼저 한 번 돌고(alembic upgrade head), 성공해야 api/scheduler/marketdata 가 뜬다.
# - 백엔드 이미지에는 backend/ 와 ml/src(학습-서빙 공유 피처 코드)가 들어간다. 모델 산출물(ml/models)은 읽기 전용 마운트.
# - 서버 배포: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build (deploy/README.md)
# - 포트는 이 컴퓨터(127.0.0.1)에만 연다. 외부 공개는 운영 설정의 Caddy(HTTPS)만 한다.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: stocksim-backend
  env_file: [{ path: .env, required: false }]  # CI 빌드에는 .env 가 없다
  environment:
    DATABASE_URL: postgresql+psycopg://stock:${POSTGRES_PASSWORD:-stock}@db:5432/stocksim
    REDIS_URL: redis://redis:6379/0
    MODEL_DIR: /ml/models
    ML_ROOT: /ml
  volumes: ["./ml/models:/ml/models:ro"]
  restart: unless-stopped

services:
  db:
    # 확장 버전을 고정한다: DB 를 덤프/복원으로 옮길 때 양쪽 TimescaleDB 버전이 같아야 한다
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      POSTGRES_DB: stocksim
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stocksim"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports: ["127.0.0.1:8000:8000"]
    depends_on: &after_migrate
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  scheduler:
    <<: *backend
    command: python -m app.pipelines.scheduler
    depends_on: *after_migrate

  marketdata:  # 반드시 단일 인스턴스 (KIS 웹소켓 세션 중복 방지, SPEC 4.1). 체결 워커도 여기서 돈다.
    <<: *backend
    command: python -m app.services.market_data
    depends_on: *after_migrate

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: stocksim-frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
